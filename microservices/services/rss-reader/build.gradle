plugins {
    id 'java'
    id 'pmd'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '0.11.4'
}

group = 'hu.therealuhlarzoltan.framestowatch'
version = '0.0.1-SNAPSHOT'
description = 'rss-reader'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.1.0")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'
    implementation 'org.springframework.cloud:spring-cloud-stream'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testImplementation 'org.springframework.cloud:spring-cloud-stream-test-binder'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

pmd {
    consoleOutput = true
    ruleSets = []
    toolVersion = "7.21.0"
}

def ws = System.getenv("GITHUB_WORKSPACE")

File repoRoot
if (ws != null && !ws.trim().isEmpty()) {
    repoRoot = file(ws)
    logger.lifecycle("[PMD] Using GITHUB_WORKSPACE as repo root: ${repoRoot.absolutePath}")
} else {
    logger.lifecycle("[PMD] GITHUB_WORKSPACE not set. Searching upwards from Gradle rootDir: ${rootDir.absolutePath}")

    def d = rootDir
    while (d != null && !new File(d, "config/pmd").isDirectory()) {
        logger.info("[PMD] config/pmd not found in: ${d.absolutePath} -> moving to parent")
        d = d.parentFile
    }

    if (d == null) {
        throw new GradleException("[PMD] Could not locate 'config/pmd' by walking up from ${rootDir.absolutePath}. " +
                "Either add it at repo root, or run with GITHUB_WORKSPACE/PMD_REPO_ROOT set.")
    }

    repoRoot = d
    logger.lifecycle("[PMD] Found repo root by traversal: ${repoRoot.absolutePath}")
}

def pmdConfigDir = new File(repoRoot, "config/pmd")
def pmdMainRules = new File(pmdConfigDir, "pmd-main.xml")
def pmdTestRules = new File(pmdConfigDir, "pmd-test.xml")

logger.lifecycle("[PMD] Ruleset dir: ${pmdConfigDir.absolutePath}")
logger.lifecycle("[PMD] Main ruleset: ${pmdMainRules.absolutePath} (exists=${pmdMainRules.exists()})")
logger.lifecycle("[PMD] Test ruleset: ${pmdTestRules.absolutePath} (exists=${pmdTestRules.exists()})")

if (!pmdMainRules.isFile()) {
    throw new GradleException("[PMD] Missing main ruleset file: ${pmdMainRules.absolutePath}")
}
if (!pmdTestRules.isFile()) {
    throw new GradleException("[PMD] Missing test ruleset file: ${pmdTestRules.absolutePath}")
}

tasks.named("pmdMain") {
    ruleSetFiles = files(pmdMainRules)
}

tasks.named("pmdTest") {
    ruleSetFiles = files(pmdTestRules)
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
