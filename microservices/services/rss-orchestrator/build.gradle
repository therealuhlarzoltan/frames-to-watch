plugins {
    id 'java'
    id 'pmd'
    id 'jacoco'
    id "org.owasp.dependencycheck" version "12.2.0"
    id "org.cyclonedx.bom" version "3.1.0"
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.hibernate.orm' version '7.2.1.Final'
    id 'org.graalvm.buildtools.native' version '0.11.4'
}

group = 'hu.therealuhlarzoltan.framestowatch'
version = '0.0.1-SNAPSHOT'
description = 'rss-orchestrator'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven {
        url = uri("https://maven.pkg.github.com/therealuhlarzoltan/frames-to-watch")
        credentials {
            username = System.getenv("GITHUB_ACTOR")
            password = System.getenv("GITHUB_TOKEN")
        }
    }
}

ext {
    set('springCloudVersion', "2025.1.0")
}

dependencies {
    implementation "hu.therealuhlarzoltan.framestowatch:api:${property('apiVersion')}"
    implementation "hu.therealuhlarzoltan.framestowatch:util:${property('utilVersion')}"

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.cloud:spring-cloud-stream'
    implementation 'org.springframework.cloud:spring-cloud-stream-binder-kafka'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.cloud:spring-cloud-stream-test-binder'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-kafka'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    constraints {
        implementation("commons-beanutils:commons-beanutils") {
            version { strictly("1.11.0") }
            because("Fixes CVE-2025-48734 (Commons BeanUtils PropertyUtilsBean enum declaredClass property issue)")
        }

        implementation("org.lz4:lz4-java") {
            version { strictly("1.8.1") }
            because("Fixes CVE-2025-12183 (lz4-java OOB memory operations leading to DoS/info disclosure)")
        }

        testImplementation("org.assertj:assertj-core") {
            version { strictly("3.27.7") }
            because("Fixes CVE-2026-24400 (AssertJ XXE in isXmlEqualTo)")
        }
        testRuntimeOnly("org.assertj:assertj-core") {
            version { strictly("3.27.7") }
            because("Fixes CVE-2026-24400 (AssertJ XXE in isXmlEqualTo)")
        }
    }
}

configurations.configureEach {
    exclude group: "at.yawk.lz4", module: "lz4-java"
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.assertj" && details.requested.name == "assertj-core"
                && details.target.name.toLowerCase().contains("test")) {
            details.useVersion("3.27.7")
            details.because("Fixes CVE-2026-24400 (AssertJ XXE in isXmlEqualTo)")
        }
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

hibernate {
    enhancement {
        enableAssociationManagement = true
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

pmd {
    consoleOutput = true
    ruleSets = []
    toolVersion = "7.21.0"
}

gradle.taskGraph.whenReady { graph ->
    def willRunPmd = graph.allTasks.any { it instanceof Pmd }
    if (!willRunPmd) {
        return
    }

    def ws = System.getenv("GITHUB_WORKSPACE")

    File repoRoot
    if (ws != null && !ws.trim().isEmpty()) {
        repoRoot = file(ws)
        logger.lifecycle("[PMD] Using GITHUB_WORKSPACE as repo root: ${repoRoot.absolutePath}")
    } else {
        logger.lifecycle("[PMD] GITHUB_WORKSPACE not set. Searching upwards from Gradle rootDir: ${rootDir.absolutePath}")

        def d = rootDir
        while (d != null && !new File(d, "config/pmd").isDirectory()) {
            logger.info("[PMD] config/pmd not found in: ${d.absolutePath} -> moving to parent")
            d = d.parentFile
        }

        if (d == null) {
            throw new GradleException("[PMD] Could not locate 'config/pmd' by walking up from ${rootDir.absolutePath}.")
        }

        repoRoot = d
        logger.lifecycle("[PMD] Found repo root by traversal: ${repoRoot.absolutePath}")
    }

    def pmdConfigDir = new File(repoRoot, "config/pmd")
    def pmdMainRules = new File(pmdConfigDir, "pmd-main.xml")
    def pmdTestRules = new File(pmdConfigDir, "pmd-test.xml")

    logger.lifecycle("[PMD] Ruleset dir: ${pmdConfigDir.absolutePath}")
    logger.lifecycle("[PMD] Main ruleset: ${pmdMainRules.absolutePath} (exists=${pmdMainRules.exists()})")
    logger.lifecycle("[PMD] Test ruleset: ${pmdTestRules.absolutePath} (exists=${pmdTestRules.exists()})")

    if (!pmdMainRules.isFile()) throw new GradleException("[PMD] Missing main ruleset file: ${pmdMainRules.absolutePath}")
    if (!pmdTestRules.isFile()) throw new GradleException("[PMD] Missing test ruleset file: ${pmdTestRules.absolutePath}")

    tasks.named("pmdMain").configure { ruleSetFiles = files(pmdMainRules) }
    tasks.named("pmdTest").configure { ruleSetFiles = files(pmdTestRules) }
}

def jacocoExcludes = ["**/*Application.class"]

jacocoTestCoverageVerification {
    classDirectories.setFrom(
            files(classDirectories.files.collect { fileTree(dir: it, exclude: jacocoExcludes) })
    )
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }
}

dependencyCheck {
    failBuildOnCVSS = 7.0
}

tasks.named("check") {
    dependsOn("jacocoTestCoverageVerification", "dependencyCheckAnalyze")
}

import org.cyclonedx.gradle.CyclonedxDirectTask

tasks.register("cyclonedxBomRuntime", CyclonedxDirectTask) {
    includeConfigs = ["runtimeClasspath"]
    jsonOutput = layout.buildDirectory.file("reports/bom-runtime.json").get().asFile
}

tasks.register("cyclonedxBomFull", CyclonedxDirectTask) {
    jsonOutput = layout.buildDirectory.file("reports/bom-full.json").get().asFile
}
